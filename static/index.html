<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台北一日遊</title>
  <link rel="stylesheet" href="/static/index.css">
</head>

<body>
  <header class="nav-bar">
    <div class="nav-content">
      <a class="site-title" href="/">台北一日遊</a> <!-- href="/" 點擊後回到首頁 -->
      <nav class="nav-links">
        <a class="booking-link" href="/booking">預訂行程</a>
        <a class="auth-link" href="#">登入/註冊</a> <!-- href="#"目前還沒有真正的登入頁面所以先暫時不跳轉 -->
      </nav>
    </div>
  </header>
  <main>
    <section class="hero-section"> <!-- 負責整個主視覺區域 -->
      <div class="hero-content"> <!-- 負責主視覺裡面的文字與搜尋內容 -->
        <div class="slogan">
        <h1>輕鬆享受台北一日悠閒</h1>
        <p>探索每個角落，體驗城市的深度旅遊行程</p>
      </div>
        <div class="search-bar"> <!-- 搜尋列的外層容器 -->
          <div class="category-wrapper"> <!-- 點擊分類後顯示選單 -->
          <button id="category-button" type="button">
          <span id="selected-category">全部分類</span>
          <span>▼</span>
          </button>
          <div id="category-menu" class="category-menu hidden"></div> <!-- 分類選單 hidden一開始先隱藏分類選單-->
          </div>
          <input id="keyword-input" type="text" placeholder="輸入景點名稱查詢"> 
          <!--建立景點搜尋輸入框 type="text":可以輸入文字 placeholder輸入前顯示的提示文字 -->
          <button id="search-button" type="button">
            <img src="/static/images/search.png" alt="搜尋">
          </button>
        </div>
      </div>
    </section>
    <section class="mrt-section">
      <button id="mrt-left-button" class="mrt-arrow mrt-arrow-left" type="button"> <!-- 左切換按鈕 -->
        <img src="/static/images/arrow-left.png" alt="上一組捷運站"> <!-- 顯示左箭頭圖片 -->
      </button>
      <div id="mrt-list" class="mrt-list"></div>
      <button id="mrt-right-button" class="mrt-arrow mrt-arrow-right" type="button"> <!-- 右切換按鈕 -->
        <img src="/static/images/arrow-right.png" alt="下一組捷運站"> <!-- 顯示右箭頭圖片 -->
      </button>
    </section>
    <section class="attraction-section"> <!-- 負責景點列表區域 -->
      <div id="attraction-list" class="attraction-list"></div>
      <div id="load-more-sentinel" aria-hidden="true"></div>
    </section>
  </main>
  <footer class="footer">
    <p class="footer-text">COPYRIGHT © 2021 台北一日遊</p>
  </footer>
<div id="auth-modal" class="auth-modal hidden"> <!-- 建立登入註冊彈窗外層 -->
  <div class="auth-backdrop"></div> <!-- 建立黑色半透明背景遮罩 -->

  <div class="auth-dialog"> <!-- 建立 Figma 登入彈窗容器 -->
    <div class="auth-decorator-bar"></div> <!-- 建立上方漸層裝飾條 -->

    <button id="auth-close-button" class="auth-close-button" type="button"> <!-- 建立右上角關閉按鈕 -->
      <img src="/static/images/close.png" alt="關閉"> <!-- 使用下載到專案的關閉圖片 -->
    </button> <!-- 結束關閉按鈕 -->

    <div class="auth-main"> <!-- 建立彈窗主要內容區 -->
      <div id="signin-view"> <!-- 建立登入畫面 -->
        <h2 class="auth-title">登入會員帳號</h2> <!-- 顯示登入標題 -->

        <form id="signin-form" class="auth-form"> <!-- 建立登入表單 -->
          <input id="signin-email" type="email" placeholder="輸入電子信箱" required> <!-- 建立 Email 輸入框 -->
          <input id="signin-password" type="password" placeholder="輸入密碼" required> <!-- 建立密碼輸入框 -->
          <button type="submit">登入帳戶</button> <!-- 建立登入按鈕 -->
        </form> <!-- 結束登入表單 -->

        <p class="auth-switch">還沒有帳戶？<button id="show-signup-button" type="button">點此註冊</button></p> <!-- 建立切換註冊按鈕 -->
        <p id="signin-message" class="auth-message"></p> <!-- 在切換文字下方顯示登入錯誤訊息 -->
      </div> <!-- 結束登入畫面 -->

      <div id="signup-view" class="hidden"> <!-- 建立註冊畫面，預設隱藏 -->
        <h2 class="auth-title">註冊會員帳號</h2> <!-- 顯示註冊標題 -->

        <form id="signup-form" class="auth-form"> <!-- 建立註冊表單 -->
          <input id="signup-name" type="text" placeholder="輸入姓名" required> <!-- 建立姓名輸入框 -->
          <input id="signup-email" type="email" placeholder="輸入電子信箱" required> <!-- 建立 Email 輸入框 -->
          <input id="signup-password" type="password" placeholder="輸入密碼" required> <!-- 建立密碼輸入框 -->
          <button type="submit">註冊新帳戶</button> <!-- 建立註冊按鈕 -->
        </form> <!-- 結束註冊表單 -->

        <p class="auth-switch">已經有帳戶了？<button id="show-signin-button" type="button">點此登入</button></p> <!-- 建立切換登入按鈕 -->
        <p id="signup-message" class="auth-message"></p> <!-- 在切換文字下方顯示註冊錯誤訊息 -->
      </div> <!-- 結束註冊畫面 -->
    </div> <!-- 結束彈窗主要內容區 -->
  </div> <!-- 結束彈窗容器 -->
</div> <!-- 結束彈窗外層 -->
  <script src="/static/auth.js"></script> <!-- 載入共用會員功能 -->
  <script src="/static/index.js"></script> <!-- 載入首頁景點功能 -->

</body>

</html>
